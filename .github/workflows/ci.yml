# GitHub Actions CI/CD pipeline.
#
# On every push and pull request:   run the unit tests.
# On pushes to main, additionally:  build images → push to ACR → deploy to AKS.
#
# Authentication uses OIDC ("workload identity federation"): GitHub
# proves its identity to Azure with a short-lived token, so NO Azure
# password or long-lived credential is ever stored in GitHub. Setup:
# https://learn.microsoft.com/en-us/azure/developer/github/connect-from-azure-openid-connect
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  ACR_NAME: ${{ vars.ACR_NAME }}
  REGISTRY: ${{ vars.ACR_NAME }}.azurecr.io

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: pip install -r tests/requirements.txt

      - name: Run tests
        run: pytest tests/ -v --tb=short

  build-and-push:
    name: Build & Push to ACR
    runs-on: ubuntu-latest
    needs: test                          # only runs if tests passed
    if: github.ref == 'refs/heads/main'  # only on main, not PRs
    permissions:
      id-token: write   # required for the OIDC login
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      # Each image gets two tags: the commit SHA (immutable, for
      # traceability) and "latest" (a convenience pointer).
      - name: Build & push ingestion image
        uses: docker/build-push-action@v5
        with:
          context: ingestion
          push: true
          tags: |
            ${{ env.REGISTRY }}/telemetry-ingestion:latest
            ${{ env.REGISTRY }}/telemetry-ingestion:${{ github.sha }}

      - name: Build & push processor image
        uses: docker/build-push-action@v5
        with:
          context: processor
          push: true
          tags: |
            ${{ env.REGISTRY }}/telemetry-processor:latest
            ${{ env.REGISTRY }}/telemetry-processor:${{ github.sha }}

  deploy:
    name: Deploy to AKS
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    # "environment: production" lets you require a manual approval step
    # in the repo settings before this job runs.
    environment: production
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ secrets.AKS_RESOURCE_GROUP }} \
            --name ${{ secrets.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      # Replace the placeholders in the manifests with the real registry
      # name and the immutable commit-SHA image tag.
      - name: Render manifests
        run: |
          find k8s -name '*.yaml' -exec \
            sed -i -e "s|<ACR_NAME>|${{ env.ACR_NAME }}|g" \
                   -e "s|:latest|:${{ github.sha }}|g" {} \;

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/redis/
          kubectl apply -f k8s/kafka/
          kubectl apply -f k8s/postgres/
          kubectl apply -f k8s/ingestion/
          kubectl apply -f k8s/processor/

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/ingestion -n telematics-pipeline --timeout=180s
          kubectl rollout status deployment/processor -n telematics-pipeline --timeout=180s
