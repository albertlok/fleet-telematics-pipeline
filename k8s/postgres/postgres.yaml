# PostgreSQL for DEVELOPMENT and STAGING only.
#
# For PRODUCTION, do not run your primary database inside the cluster —
# use Azure Database for PostgreSQL Flexible Server (the setup-aks.sh
# script provisions one). A managed database gives you automated
# backups, point-in-time restore, and failover for free.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: telematics-pipeline
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: telemetry
            - name: POSTGRES_USER
              value: fleet
            # The password comes from the Kubernetes Secret, never from
            # this file.
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pipeline-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: managed-premium
        resources:
          requests:
            storage: 100Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: telematics-pipeline
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
