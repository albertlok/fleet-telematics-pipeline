# Autoscaler for the processor pods. CPU is a reasonable first proxy for
# load; a more advanced setup would scale on Kafka consumer lag (how far
# behind the processors are) using KEDA: https://keda.sh
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: processor-hpa
  namespace: telematics-pipeline
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: processor
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
