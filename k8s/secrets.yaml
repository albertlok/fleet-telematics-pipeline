# TEMPLATE ONLY — this file ships with placeholders and must stay that
# way. Never commit real secret values to Git. The recommended approach
# is to skip this file entirely and create the secret with kubectl, so
# real values never touch the repo:
#
#   kubectl create secret generic pipeline-secrets \
#     -n telematics-pipeline \
#     --from-literal=DB_DSN='postgresql://user:pass@host:5432/telemetry?sslmode=require' \
#     --from-literal=WEBHOOK_SECRET='<secret from your telematics provider>' \
#     --from-literal=POSTGRES_PASSWORD='<dev postgres password>'
#
# If you must apply this file directly, replace the placeholders with
# base64-encoded values:  echo -n 'my-value' | base64
#
# For production, prefer Azure Key Vault + the Secrets Store CSI Driver,
# which injects secrets into pods without storing them in Kubernetes at all.
apiVersion: v1
kind: Secret
metadata:
  name: pipeline-secrets
  namespace: telematics-pipeline
type: Opaque
data:
  WEBHOOK_SECRET: <BASE64_WEBHOOK_SECRET>
  DB_DSN: <BASE64_DB_DSN>
  POSTGRES_PASSWORD: <BASE64_POSTGRES_PASSWORD>
